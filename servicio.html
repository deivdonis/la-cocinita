<body data-pagina="service">
  <a class="skip-link" href="#contenido" data-i18n="a11y.skip">Saltar al contenido</a>

  <div id="cabecera"></div>

  <main id="contenido">
    <header class="cabecera-pagina">
      <div class="contenedor">
        <p class="antetitulo" data-i18n="service.eyebrow"></p>
        <h1 data-i18n="service.title"></h1>
        <p data-i18n="service.lead"></p>
      </div>
    </header>

    <!-- Pasos. IMPORTANTE: aquí NO va ningún enlace ni botón a la aplicación del
         restaurante: solo funciona dentro del local, conectado a su Wi-Fi. -->
    <section class="seccion" aria-labelledby="titulo-pasos">
      <div class="contenedor">
        <h2 id="titulo-pasos" class="sr-only" data-i18n="service.title"></h2>
        <div class="aviso-local"><span data-icono="info"></span><p data-i18n="service.onlyInside"></p></div>
        <ol class="pasos">
          <li class="paso">
            <span class="paso__icono"><span data-icono="wifi"></span></span>
            <div><span class="paso__numero"><span data-i18n="service.stepLabel"></span> 1</span><h2 data-i18n="service.step1t"></h2><p data-i18n="service.step1d"></p></div>
          </li>
          <li class="paso">
            <span class="paso__icono"><span data-icono="qr"></span></span>
            <div><span class="paso__numero"><span data-i18n="service.stepLabel"></span> 2</span><h2 data-i18n="service.step2t"></h2><p data-i18n="service.step2d"></p></div>
          </li>
          <li class="paso">
            <span class="paso__icono"><span data-icono="movil"></span></span>
            <div><span class="paso__numero"><span data-i18n="service.stepLabel"></span> 3</span><h2 data-i18n="service.step3t"></h2><p data-i18n="service.step3d"></p></div>
          </li>
          <li class="paso">
            <span class="paso__icono"><span data-icono="mano"></span></span>
            <div><span class="paso__numero"><span data-i18n="service.stepLabel"></span> 4</span><h2 data-i18n="service.step4t"></h2><p data-i18n="service.step4d"></p></div>
          </li>
          <li class="paso">
            <span class="paso__icono"><span data-icono="campana"></span></span>
            <div><span class="paso__numero"><span data-i18n="service.stepLabel"></span> 5</span><h2 data-i18n="service.step5t"></h2><p data-i18n="service.step5d"></p></div>
          </li>
        </ol>
      </div>
    </section>

    <section class="seccion seccion--alterna" aria-labelledby="titulo-funciones">
      <div class="contenedor">
        <header class="seccion__cabecera"><h2 id="titulo-funciones" data-i18n="service.featuresTitle"></h2></header>
        <ul class="funciones">
          <li><span data-icono="campana"></span><span data-i18n="service.f1"></span></li>
          <li><span data-icono="carta"></span><span data-i18n="service.f2"></span></li>
          <li><span data-icono="microfono"></span><span data-i18n="service.f3"></span></li>
          <li><span data-icono="cuenta"></span><span data-i18n="service.f4"></span></li>
        </ul>
      </div>
    </section>

    <section class="seccion" aria-labelledby="titulo-faq">
      <div class="contenedor">
        <header class="seccion__cabecera"><h2 id="titulo-faq" data-i18n="service.faqTitle"></h2></header>
        <div class="faq">
          <details><summary data-i18n="service.q1"></summary><p data-i18n="service.a1"></p></details>
          <details><summary data-i18n="service.q2"></summary><p data-i18n="service.a2"></p></details>
          <details><summary data-i18n="service.q3"></summary><p data-i18n="service.a3"></p></details>
          <details><summary data-i18n="service.q4"></summary><p data-i18n="service.a4"></p></details>
          <details><summary data-i18n="service.q5"></summary><p data-i18n="service.a5"></p></details>
        </div>
      </div>
    </section>

    <section class="seccion reservas cta-final" aria-labelledby="titulo-cta">
      <div class="contenedor">
        <h2 id="titulo-cta" data-i18n="service.ctaTitle"></h2>
        <p data-i18n="service.ctaText"></p>
        <div class="fila-botones fila-botones--centro">
          <a class="btn btn--claro btn--grande" data-tel href="index.html#reservas"><span data-icono="telefono"></span><span data-i18n="book.callShort"></span></a>
          <a class="btn btn--whatsapp btn--grande" data-wa href="index.html#reservas"><span data-icono="whatsapp"></span><span data-i18n="book.whatsapp"></span></a>
          <a class="btn btn--contorno-claro btn--grande" href="index.html"><span data-icono="flechaIzq"></span><span data-i18n="service.back"></span></a>
        </div>
      </div>
    </section>
